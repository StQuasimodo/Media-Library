name: mpv API22 subtitle scale backport
on:
  workflow_dispatch:
  push:
    branches: [poc/mpv-api22-validation]
    paths:
      - '.github/workflows/mpv-backport-api22.yml'
      - 'scripts/mpv-api22/patches/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      IN_CI: '1'
      DONT_BUILD_RELEASE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865'
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkgconf ninja-build gperf wget unzip python3-pip
          python3 -m pip install --user --break-system-packages 'meson==1.11.1'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Android wrapper and install native dependencies
        run: |
          set -euo pipefail
          mkdir -p .harness
          git clone https://github.com/mpv-android/mpv-android .harness/mpv-android
          git -C .harness/mpv-android checkout --detach 3018d47277d5b3ca02acdd96466f261c1d23ee08
          mkdir -p .harness/mpv-android/buildscripts/sdk
          ln -s "$ANDROID_HOME" .harness/mpv-android/buildscripts/sdk/android-sdk-linux
          ln -s "$ANDROID_HOME/ndk/29.0.14206865" .harness/mpv-android/buildscripts/sdk/android-ndk-r29
          cd .harness/mpv-android/buildscripts
          ./download.sh
      - name: Pin mpv and apply reviewed exact-context backport
        run: |
          set -euo pipefail
          source=.harness/mpv-android/buildscripts/deps/mpv
          git -C "$source" checkout --detach 9ce79bcaa0132660a2e45b6bfc1fb0c199665277
          git -C "$source" apply --check "$GITHUB_WORKSPACE/scripts/mpv-api22/patches/secondary-sub-scale-9ce79bc.patch"
          git -C "$source" apply "$GITHUB_WORKSPACE/scripts/mpv-api22/patches/secondary-sub-scale-9ce79bc.patch"
          git -C "$source" diff --check
          mkdir -p .harness/backport-report
          git -C "$source" diff > .harness/backport-report/applied.patch
          for dep in .harness/mpv-android/buildscripts/deps/*; do
            if [ -d "$dep/.git" ]; then printf '%s ' "$dep"; git -C "$dep" rev-parse HEAD; fi
          done | tee .harness/backport-report/git-dependencies.txt
          sha256sum scripts/mpv-api22/patches/secondary-sub-scale-9ce79bc.patch > .harness/backport-report/patch.sha256
      - name: Build ARMv7 and x86 libmpv and APK
        working-directory: .harness/mpv-android/buildscripts
        run: |
          set -euo pipefail
          ./buildall.sh --arch armv7l mpv
          ./buildall.sh --arch x86 mpv
          ./buildall.sh --arch x86 mpv-android
      - name: Verify both ABI libraries and API21 APK
        run: |
          set -euo pipefail
          for arch in armv7l x86; do
            lib=".harness/mpv-android/buildscripts/prefix/$arch/lib/libmpv.so"
            test -s "$lib"
            file "$lib"
            sha256sum "$lib"
          done | tee .harness/backport-report/libraries.txt
          apk=.harness/mpv-android/app/build/outputs/apk/default/debug/app-default-universal-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee .harness/backport-report/badging.txt
          grep -qx "sdkVersion:'21'" .harness/backport-report/badging.txt
          sha256sum "$apk" | tee .harness/backport-report/apk.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpv-api22-backport-build
          if-no-files-found: warn
          path: |
            .harness/backport-report/
            .harness/mpv-android/app/build/outputs/apk/default/debug/app-default-universal-debug.apk
