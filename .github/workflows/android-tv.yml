name: Android TV API 22 preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-tv-preview
  cancel-in-progress: false
jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Keep the development signing identity across preview builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: my-cinema-tv-development-signing-v1
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint native APK and separate instrumentation
        working-directory: android-tv
        run: ./gradlew --no-daemon lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify API 21 minimum, v1 signature and universal Java APK
        run: |
          mkdir -p .harness/android-tv-package
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 21 android-tv/app/build/outputs/apk/debug/app-debug.apk | tee .harness/android-tv-package/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-tv/app/build/outputs/apk/debug/app-debug.apk > .harness/android-tv-package/badging.txt
          python3 scripts/verify-android-tv.py
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Install, launch and exercise actual API 22
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 22
          target: default
          arch: x86
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-tv-smoke.sh
      - name: Prepare installable development preview
        run: |
          mkdir -p android-tv/release
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk android-tv/release/My-Cinema-TV-0.1.0-alpha.1-debug.apk
          cp .harness/android-tv-package/report.json android-tv/release/BUILD.json
          cd android-tv/release
          sha256sum My-Cinema-TV-0.1.0-alpha.1-debug.apk BUILD.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: my-cinema-tv-0.1.0-alpha.1
          if-no-files-found: error
          path: android-tv/release/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-tv-api22-evidence
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .harness/android-tv-package/*
            .harness/android-tv-emulator/*
            android-tv/app/build/reports/lint-results-debug.*
