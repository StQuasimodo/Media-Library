name: TV API22 validation
on:
  push:
    branches: [fix/tv-browser-lifecycle, fix/tv-resource-names, feat/tv-portable-backup]
  workflow_dispatch:
    inputs:
      suite:
        description: Full playback regression or focused resource-name and catalog validation
        type: choice
        options: [full, resource_names, backup]
        default: full
permissions:
  contents: read
concurrency:
  group: tv-browser-lifecycle-validation
  cancel-in-progress: false
jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Validation only: ephemeral signer; no APK is uploaded or published.
      TV_TEST_SUITE: ${{ github.ref_name == 'feat/tv-portable-backup' && 'backup' || github.ref_name == 'fix/tv-resource-names' && 'resource_names' || inputs.suite || 'full' }}
      TV_APK_TARGET: working
      TV_PROFILE: api22-hd-1gb
      TV_DENSITY: '160'
      TV_HEAP_MIB: '96'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and lint native APK and separate instrumentation
        working-directory: android-tv
        run: ./gradlew --no-daemon lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify API 21 minimum, v1 signature and ARMv7/x86 decoder
        run: |
          mkdir -p .harness/android-tv-package
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 21 android-tv/app/build/outputs/apk/debug/app-debug.apk | tee .harness/android-tv-package/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-tv/app/build/outputs/apk/debug/app-debug.apk > .harness/android-tv-package/badging.txt
          python3 scripts/verify-android-tv.py
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Prepare full UI protocol fixture without application hooks
        if: env.TV_TEST_SUITE == 'full'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          node scripts/prepare-tv-regression.mjs
          python3 scripts/tv-regression-server.py prepare
          bash scripts/prepare-tv-playback.sh
          sudo python3 scripts/tv-regression-server.py serve > .harness/tv-regression/fixture-server.log 2>&1 &
      - name: Install, launch and exercise actual API 22
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-build: 11237101
          api-level: 22
          target: default
          arch: x86
          profile: Nexus 5
          ram-size: 1024M
          heap-size: 96M
          pre-emulator-launch-script: python3 scripts/configure-tv-avd.py
          disable-animations: true
          emulator-options: -writable-system -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1280x720 -dpi-device 160
          script: bash scripts/android-tv-validation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-${{ env.TV_TEST_SUITE }}-evidence
          if-no-files-found: warn
          path: |
            .harness/tv-playback/report.json
            .harness/tv-playback/quark-dav-report.json
            .harness/tv-playback/instrumentation.txt
            .harness/tv-playback/logcat.txt
            .harness/android-tv-package/report.json
            .harness/tv-regression/*.json
            .harness/tv-resource-names/*
            .harness/tv-backup/*
            .harness/android-tv-emulator/report.json
            .harness/android-tv-emulator/network-report.json
            .harness/android-tv-emulator/instrumentation.txt
            android-tv/app/build/reports/lint-results-debug.*
