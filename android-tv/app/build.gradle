plugins { id 'com.android.application' }

// Disposable migration validation only. The production application ID stays unchanged.
def migrationPreview = project.hasProperty('tvMigrationPreview')
if (project.hasProperty('tvUpgradeTestVersionCode') && !migrationPreview) {
    throw new GradleException('Upgrade test versions require the isolated migration preview ID')
}

android {
    namespace 'io.mycinema.tv'
    compileSdk 36
    defaultConfig {
        applicationId migrationPreview ? 'io.mycinema.tv.preview' : 'io.mycinema.tv'
        manifestPlaceholders = [appLabel: migrationPreview ? 'My Cinema · 迁移验证' : 'My Cinema']
        minSdk 21
        ndk { abiFilters 'armeabi-v7a', 'x86' }
        targetSdk 35
        versionCode 18
        if (migrationPreview && project.hasProperty('tvUpgradeTestVersionCode')) {
            versionCode Integer.parseInt(project.property('tvUpgradeTestVersionCode'))
        }
        versionName '0.3.0-alpha.10'
        testInstrumentationRunner 'io.mycinema.tv.SmokeInstrumentation'
    }
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            if (System.getenv('TV_PIN_DEVELOPMENT_SIGNING') == '1') {
                storeFile file("${System.getProperty('user.home')}/.android/mycinema-tv-debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildFeatures { buildConfig true }
    sourceSets { androidTest.assets.srcDir '../../tests/fixtures'; androidTest.assets.srcDir '../../updates'; main.assets.srcDir '../../src/shared/data' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
}
