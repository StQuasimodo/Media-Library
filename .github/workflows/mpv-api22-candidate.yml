name: mpv API22 candidate playback
on:
  workflow_dispatch:
  push:
    branches: [poc/mpv-api22-validation]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download and verify API21 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .harness/mpv-candidate
          gh release download 2026-04-25 -R mpv-android/mpv-android -p app-default-x86-release.apk -D .harness/mpv-candidate
          echo '2cf77b8cc654b9a257602aff0ad7f8c7e933dd91b99a29f9ca02f3c397e6b1dc  .harness/mpv-candidate/app-default-x86-release.apk' | sha256sum -c -
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$aapt" dump badging .harness/mpv-candidate/app-default-x86-release.apk | tee .harness/mpv-candidate/badging.txt
          grep -qx "sdkVersion:'21'" .harness/mpv-candidate/badging.txt
      - name: Install media fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Create deterministic H264 sample
        run: bash scripts/mpv-api22/create-fixture.sh
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Start adb server
        run: adb start-server
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 22
          target: default
          arch: x86
          profile: Nexus 5
          ram-size: 1024M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/mpv-api22/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpv-api22-candidate-evidence
          path: .harness/mpv-candidate/
          if-no-files-found: warn
