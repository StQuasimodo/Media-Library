name: Frontend Windows interaction validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies and Electron
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Test and build renderer and desktop bridge
        run: |
          pnpm test
          pnpm build
      - name: Exercise actual Windows Electron with controlled data
        run: |
          pnpm test:desktop --quark-fixture
          pnpm test:desktop --quark-sync-fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-windows-evidence
          include-hidden-files: true
          path: |
            .harness/desktop-smoke-*/report.json
            .harness/desktop-smoke-*/*.png
