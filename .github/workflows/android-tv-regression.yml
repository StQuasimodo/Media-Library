name: Android TV emulator regression matrix
on:
  workflow_dispatch:
    inputs:
      apk_target:
        description: Test the published APK unchanged, or current working APK after a fix
        type: choice
        options: [working, released]
        default: working
      release_tag:
        type: string
        default: tv-v0.1.0-alpha.2
permissions:
  contents: read
jobs:
  signing:
    uses: ./.github/workflows/tv-development-signing.yml
  regression:
    needs: signing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: api22-hd-1gb-96m
            skin: 1280x720
            density: 160
            ram: 1024M
            heap: 96M
            heap_mib: 96
          - profile: api22-fhd-1gb-64m
            skin: 1920x1080
            density: 320
            ram: 1024M
            heap: 64M
            heap_mib: 64
    env:
      GH_TOKEN: ${{ github.token }}
      TV_APK_TARGET: ${{ inputs.apk_target }}
      TV_RELEASE_TAG: ${{ inputs.release_tag }}
      TV_DENSITY: ${{ matrix.density }}
      TV_PROFILE: ${{ matrix.profile }}
      TV_PIN_DEVELOPMENT_SIGNING: '1'
      TV_EXPECTED_SIGNER: ${{ needs.signing.outputs.sha256 }}
      TV_HEAP_MIB: ${{ matrix.heap_mib }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/mycinema-tv-debug.keystore
          key: my-cinema-tv-development-signing-v2
          fail-on-cache-miss: true
      - name: Build separate test APK and select original or working application
        run: |
          bash scripts/tv-dev-signing.sh
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          cd android-tv
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
          cd ..
          node scripts/prepare-tv-regression.mjs
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs .harness/tv-regression/target.apk > .harness/tv-regression/app-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android-tv/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > .harness/tv-regression/test-signature.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          cert=lambda path:re.search(r'certificate SHA-256 digest: (.+)',Path(path).read_text()).group(1)
          assert cert('.harness/tv-regression/app-signature.txt')==cert('.harness/tv-regression/test-signature.txt'),'Cached signing identity must match original APK; do not re-sign it.'
          PY
      - name: Start isolated protocol fixture
        run: |
          python3 scripts/tv-regression-server.py prepare
          sudo python3 scripts/tv-regression-server.py serve > .harness/tv-regression/fixture-server.log 2>&1 &
          sudo chmod a+rw /dev/kvm
      - name: Full UI, process restart, reboot and constrained profile checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 22
          target: default
          arch: x86
          profile: Nexus 5
          ram-size: ${{ matrix.ram }}
          heap-size: ${{ matrix.heap }}
          pre-emulator-launch-script: python3 scripts/configure-tv-avd.py
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin ${{ matrix.skin }} -dpi-device ${{ matrix.density }}
          script: bash scripts/android-tv-regression.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-regression-${{ matrix.profile }}
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .harness/tv-regression/*.json
            .harness/tv-regression/*.jsonl
            .harness/tv-regression/*.txt
            .harness/tv-regression/*.png
            .harness/tv-regression/*.log
