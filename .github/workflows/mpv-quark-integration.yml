name: mpv Quark integration API22 experiment
on:
  push:
    branches: [poc/mpv-quark-integration]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mpv-quark-integration
  cancel-in-progress: false
jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TV_APK_TARGET: working
      TV_PROFILE: api22-hd-1gb
      TV_DENSITY: '160'
      TV_HEAP_MIB: '96'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Provision exact previously verified mpv libraries in the test APK only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .harness/mpv-provision
          gh run download 42583190460 -R "$GITHUB_REPOSITORY" -n mpv-api22-backport-build -D .harness/mpv-provision
          mapfile -t apks < <(find .harness/mpv-provision -name app-default-universal-debug.apk -type f)
          test "${#apks[@]}" -eq 1
          echo "743176933d593bbf7f10db084371ce4c07d4ce6eabeac3fd6b9958f4f478f6ee  ${apks[0]}" | sha256sum -c -
          python3 scripts/prepare-mpv-test-native.py "${apks[0]}"
      - name: Build and lint native APK and separate instrumentation
        working-directory: android-tv
        run: ./gradlew --no-daemon lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify API 21 minimum, v1 signature and ARMv7/x86 decoder
        run: |
          mkdir -p .harness/android-tv-package
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 21 android-tv/app/build/outputs/apk/debug/app-debug.apk | tee .harness/android-tv-package/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-tv/app/build/outputs/apk/debug/app-debug.apk > .harness/android-tv-package/badging.txt
          python3 scripts/verify-android-tv.py
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Prepare full UI protocol fixture without application hooks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          node scripts/prepare-tv-regression.mjs
          python3 scripts/tv-regression-server.py prepare
          bash scripts/prepare-tv-playback.sh
          sudo python3 scripts/tv-regression-server.py serve > .harness/tv-regression/fixture-server.log 2>&1 &
      - name: Install, launch and exercise actual API 22
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-build: 11237101
          api-level: 22
          target: default
          arch: x86
          profile: Nexus 5
          ram-size: 1024M
          heap-size: 96M
          pre-emulator-launch-script: python3 scripts/configure-tv-avd.py
          disable-animations: true
          emulator-options: -writable-system -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1280x720 -dpi-device 160
          script: |
            bash scripts/android-tv-smoke.sh
            bash scripts/android-tv-playback.sh
            bash scripts/android-tv-regression.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpv-quark-integration-evidence
          if-no-files-found: warn
          path: |
            .harness/tv-playback/report.json
            .harness/tv-playback/quark-dav-report.json
            .harness/tv-playback/instrumentation.txt
            .harness/tv-playback/logcat.txt
