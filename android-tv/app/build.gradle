plugins { id 'com.android.application' }

// Disposable migration validation only. The production application ID stays unchanged.
def migrationPreview = project.hasProperty('tvMigrationPreview')
if (project.hasProperty('tvUpgradeTestVersionCode') && !migrationPreview) {
    throw new GradleException('Upgrade test versions require the isolated migration preview ID')
}

android {
    namespace 'io.mycinema.tv'
    compileSdk 36
    defaultConfig {
        applicationId migrationPreview ? 'io.mycinema.tv.preview' : 'io.mycinema.tv'
        manifestPlaceholders = [appLabel: migrationPreview ? 'My Cinema · 迁移验证' : 'My Cinema']
        minSdk 21
        ndk { abiFilters 'armeabi-v7a', 'x86' }
        targetSdk 35
        versionCode 29
        if (migrationPreview && project.hasProperty('tvUpgradeTestVersionCode')) {
            versionCode Integer.parseInt(project.property('tvUpgradeTestVersionCode'))
        }
        versionName '0.3.0-alpha.21'
        testInstrumentationRunner 'io.mycinema.tv.SmokeInstrumentation'
    }
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            if (System.getenv('TV_PIN_DEVELOPMENT_SIGNING') == '1') {
                storeFile file("${System.getProperty('user.home')}/.android/mycinema-tv-debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    // Project JNI libraries take precedence over dependency libraries. Both
    // decoders use the pinned mpv build's newer C++ runtime on each ABI.
    packaging.jniLibs {
        pickFirsts += ['**/libc++_shared.so']
        keepDebugSymbols += ['**/libc++_shared.so']
    }
    buildFeatures { buildConfig true }
    sourceSets { androidTest.assets.srcDir '../../tests/fixtures'; androidTest.assets.srcDir '../../updates'; main.assets.srcDir '../../src/shared/data' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError true; checkReleaseBuilds true }
}

def mpvLibs = layout.buildDirectory.dir('generated/mpvJni')
def prepareMpv = tasks.register('prepareMpvLibraries', Exec) {
    inputs.file('../../scripts/prepare-tv-mpv.py')
    outputs.dir(mpvLibs)
    commandLine 'python3', '../../scripts/prepare-tv-mpv.py', mpvLibs.get().asFile
}
android.sourceSets.main.jniLibs.srcDir(mpvLibs)
tasks.named('preBuild').configure { dependsOn prepareMpv }

dependencies {
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.12.13'
}
