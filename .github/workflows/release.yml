name: Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned package manager and dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build production application
        run: pnpm build
      - name: Check real Electron, preload and SQLite on Windows
        run: pnpm test:desktop --quark-fixture
      - name: Build NSIS installer and portable archive
        run: node scripts/package.mjs
      - name: Verify packaged files and write SHA-256 checksums
        run: node scripts/verify-release.mjs
      - name: Retain build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-cinema-windows
          if-no-files-found: error
          path: |
            release/*Setup.exe
            release/*portable-win64.zip
            release/INSTALL.cmd
            release/RUN-PORTABLE.cmd
            release/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release create "v$version" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "My Cinema v$version" --notes-file docs/RELEASE-NOTES.md "release/My-Cinema-$version-Setup.exe" "release/My-Cinema-$version-portable-win64.zip" release/INSTALL.cmd release/RUN-PORTABLE.cmd release/SHA256SUMS.txt
      - name: Retain desktop diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-evidence
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .harness/desktop-smoke-*/report.json
            .harness/desktop-smoke-*/*.png
