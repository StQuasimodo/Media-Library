plugins { id 'com.android.application' }

android {
    namespace 'io.mycinema.tv'
    compileSdk 36
    defaultConfig {
        applicationId 'io.mycinema.tv'
        minSdk 21
        ndk { abiFilters 'armeabi-v7a', 'x86' }
        targetSdk 35
        versionCode 4
        versionName '0.2.0-alpha.1'
        testInstrumentationRunner 'io.mycinema.tv.SmokeInstrumentation'
    }
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            if (System.getenv('TV_PIN_DEVELOPMENT_SIGNING') == '1') {
                storeFile file("${System.getProperty('user.home')}/.android/mycinema-tv-debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
}
