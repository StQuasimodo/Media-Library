name: Publish verified retained release
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Windows release run with verified retained artifacts
        required: true
        type: string
      build_source:
        description: Exact 40-character source commit of that build
        required: true
        type: string
      artifact_name:
        description: Retained artifact from the validated build
        type: choice
        options:
          - my-cinema-windows
          - My-Cinema-Integrated-Quark-Preview
        default: my-cinema-windows
      use_current_notes:
        description: Use the reviewed release notes from this checkout instead of historical build notes
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: release
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify actual installer choices before publishing retained files
        run: |
          $setups = @(Get-ChildItem release -Filter '*Setup.exe')
          if ($setups.Count -ne 1) { throw 'Expected one retained installer' }
          ./scripts/check-installer.ps1 -Installer $setups[0].FullName
      - name: Verify retained build identity and checksums, then publish original files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ inputs.build_source }}
          RELEASE_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_BUILD_ARTIFACT: ${{ inputs.artifact_name }}
          RELEASE_USE_CURRENT_NOTES: ${{ inputs.use_current_notes }}
        run: |
          $publishArguments = @()
          if ($env:RELEASE_USE_CURRENT_NOTES -eq 'true') { $publishArguments += @('--notes-file', 'docs/RELEASE-NOTES.md') }
          node scripts/publish-release.mjs @publishArguments

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-installer-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          path: .harness/nsis-shortcut-*/report.json

  update-feeds:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/update-feeds.yml
    secrets: inherit
